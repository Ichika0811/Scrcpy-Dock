name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build portable directory
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1 -Python python
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Get-Item "release\ScrcpyDock\ScrcpyDock.exe").VersionInfo.FileVersion
          Compress-Archive -Path "release\ScrcpyDock" -DestinationPath "ScrcpyDock-v$version-win64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyDock-win64
          path: ScrcpyDock-v*-win64.zip
          if-no-files-found: error
